[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chemgridmap"
version = "0.3.1rc1"
description = "Curate ChEMBL activity exports and build one-molecule-per-cell chemical maps."
readme = "README.md"
requires-python = ">=3.10"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [
  {name = "Zhenming Qiu"}
]
keywords = [
  "chemical space",
  "ChEMBL",
  "bioactivity curation",
  "cheminformatics",
  "dimensionality reduction",
  "molecular visualization",
  "grid map"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Chemistry"
]
dependencies = [
  "matplotlib>=3.6",
  "numpy>=1.23",
  "pandas>=1.5",
  "rdkit>=2022.9.5",
  "chembl_structure_pipeline>=1.2.0",
  "scikit-learn>=1.2",
  "scipy>=1.9"
]

[project.urls]
Homepage = "https://github.com/Quinnball/ChemGridMap"
Repository = "https://github.com/Quinnball/ChemGridMap.git"
Issues = "https://github.com/Quinnball/ChemGridMap/issues"

[project.optional-dependencies]
umap = ["umap-learn>=0.5.3"]
dev = ["pytest>=7", "build>=1"]
paper = ["python-docx>=1.1", "pymupdf>=1.24"]

[project.scripts]
chemgridmap = "chemgridmap.cli:main"
chemgridmap-app = "chemgridmap.app:main"

[tool.setuptools.package-data]
chemgridmap = ["web/*.html", "web/*.css", "web/*.js", "web/*.svg", "data/*.csv", "data/*.json"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
