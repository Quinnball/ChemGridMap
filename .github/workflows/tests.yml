name: tests

on:
  push:
  pull_request:

jobs:
  test:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install package and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run tests
        run: python -m pytest -q

  paper:
    name: Paper dependencies and wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev,umap,paper]"
      - run: python -m pytest -q
      - run: python -m build
      - name: Import independently installed wheel
        shell: bash
        run: |
          python -m venv /tmp/chemgridmap-wheel
          /tmp/chemgridmap-wheel/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/chemgridmap-wheel/bin/python -c "import chemgridmap; print(chemgridmap.__version__, chemgridmap.__file__)"
          /tmp/chemgridmap-wheel/bin/python -m chemgridmap --help
          /tmp/chemgridmap-wheel/bin/python -m chemgridmap.app --smoke-test --output-dir /tmp/wheel-example
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: |
            dist/*.whl
            dist/*.tar.gz

  installed:
    name: Installed wheel on ${{ matrix.os }}
    needs: paper
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist
      - name: Verify installed package outside checkout
        shell: python
        run: |
          from pathlib import Path
          import os, subprocess, sys, tempfile
          wheel = next(Path('dist').glob('*.whl')).resolve()
          with tempfile.TemporaryDirectory() as work:
              env = {k: v for k, v in os.environ.items() if k not in ('PYTHONPATH', 'PYTHONHOME', 'VIRTUAL_ENV')}
              venv = Path(work) / 'venv'
              subprocess.run([sys.executable, '-m', 'venv', str(venv)], check=True)
              python = venv / ('Scripts/python.exe' if sys.platform == 'win32' else 'bin/python')
              subprocess.run([str(python), '-m', 'pip', 'install', f'{wheel}[umap]'],
                             cwd=work, env=env, check=True)
              subprocess.run([str(python), '-m', 'chemgridmap', '--help'], cwd=work, env=env, check=True)
              for method in ('pca', 'umap'):
                  subprocess.run([str(python), '-m', 'chemgridmap.app', '--smoke-test', '--smoke-projection', method,
                                  '--output-dir', str(Path(work) / method)], cwd=work, env=env,
                                 check=True, timeout=900)

  release:
    name: Publish tested release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, paper, installed]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const version = fs.readFileSync('pyproject.toml', 'utf8').match(/^version = "([^"]+)"/m)[1];
            const tag = `v${version}`;
            const {owner, repo} = context.repo;
            try {
              await github.rest.repos.getReleaseByTag({owner, repo, tag});
              core.info(`${tag} already exists; leaving it unchanged.`);
              return;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            const result = await github.rest.repos.createRelease({owner, repo, tag_name: tag,
              target_commitish: context.sha, name: `ChemGridMap ${version}`, draft: false, prerelease: false,
              body: 'A Python tool for ChEMBL CSV curation, molecular grid maps and source-record inspection. Install the source package or wheel; use the command line or the optional English browser interface. No standalone desktop app or hosted account is required. Python 3.10+ is required; Python 3.12 is recommended.\n\nThis release passed the Python 3.10/3.12 test matrix on Linux, macOS, and Windows, the Linux paper-dependency/wheel job, and independently installed PCA/UMAP example checks on all three operating systems. These checks do not establish bitwise UMAP equivalence or compatibility with every OS version.\n\nThe validation archive contains public ChEMBL inputs, saved coordinates, task results, and vector figures. Extract it at the repository root. See paper/README.md for reproduction commands. The archive preserves earlier layout experiments and their recorded versions; no manuscript drafts are included.'});
            const paths = fs.readdirSync('dist').filter(name => fs.statSync(`dist/${name}`).isFile()).map(name => `dist/${name}`);
            paths.push(`validation_data/chemgridmap-${version}-validation.zip`);
            for (const path of paths) {
              const data = fs.readFileSync(path);
              await github.rest.repos.uploadReleaseAsset({owner, repo, release_id: result.data.id,
                name: path.split('/').pop(), data});
            }
