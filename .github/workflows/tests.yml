name: tests

on:
  push:
  pull_request:

jobs:
  test:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install package and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run tests
        run: python -m pytest -q

  paper:
    name: Paper dependencies and wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev,umap,paper]"
      - run: python -m pytest -q
      - run: python -m build
      - name: Import independently installed wheel
        shell: bash
        run: |
          python -m venv /tmp/chemgridmap-wheel
          /tmp/chemgridmap-wheel/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/chemgridmap-wheel/bin/python -c "import chemgridmap; print(chemgridmap.__version__, chemgridmap.__file__)"
          /tmp/chemgridmap-wheel/bin/python -m chemgridmap --help
          /tmp/chemgridmap-wheel/bin/python -m chemgridmap.app --smoke-test --output-dir /tmp/wheel-example
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/*

  desktop:
    name: Native application on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install ".[umap]" "pyinstaller==6.22.2"
      - run: python scripts/build_desktop.py
      - name: Verify frozen application outside checkout
        shell: python
        run: |
          from pathlib import Path
          import os, subprocess, sys, tempfile
          root = Path.cwd()
          if sys.platform == 'darwin':
              app = root / 'dist/desktop/ChemGridMap.app/Contents/MacOS/ChemGridMap'
          else:
              app = root / 'dist/desktop/ChemGridMap' / ('ChemGridMap.exe' if sys.platform == 'win32' else 'ChemGridMap')
          with tempfile.TemporaryDirectory() as work:
              env = {k: v for k, v in os.environ.items() if k not in ('PYTHONPATH', 'PYTHONHOME', 'VIRTUAL_ENV')}
              for method in ('pca', 'umap'):
                  subprocess.run([str(app), '--smoke-test', '--smoke-projection', method,
                                  '--output-dir', str(Path(work) / method)], cwd=work, env=env,
                                 check=True, timeout=900)
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: |
            dist/ChemGridMap-*.zip
            dist/ChemGridMap-*.tar.gz
            dist/ChemGridMap-*.sha256

  release:
    name: Publish tested release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, paper, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          merge-multiple: true
          path: dist
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const version = fs.readFileSync('pyproject.toml', 'utf8').match(/^version = "([^"]+)"/m)[1];
            const tag = `v${version}`;
            const {owner, repo} = context.repo;
            try {
              await github.rest.repos.getReleaseByTag({owner, repo, tag});
              core.info(`${tag} already exists; leaving it unchanged.`);
              return;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            const result = await github.rest.repos.createRelease({owner, repo, tag_name: tag,
              target_commitish: context.sha, name: `ChemGridMap ${version}`, draft: false, prerelease: false,
              body: 'Local browser application with CSV import, molecular maps, source-record inspection and result downloads. Native archives bundle Python, RDKit and UMAP. The macOS candidate is ad-hoc signed, not Apple-notarized.\n\nThis release passed the Python 3.10/3.12 test matrix on Linux, macOS, and Windows, the Linux paper-dependency/wheel job, and frozen PCA/UMAP example checks on each desktop build platform. These checks do not establish bitwise UMAP equivalence or compatibility with every OS version.\n\nThe validation archive contains public ChEMBL inputs, saved coordinates, task results, and vector figures. Extract it at the repository root. See paper/README.md for reproduction commands. The archive preserves earlier layout experiments and their recorded versions; no manuscript drafts are included.'});
            const paths = fs.readdirSync('dist').filter(name => fs.statSync(`dist/${name}`).isFile()).map(name => `dist/${name}`);
            paths.push(`validation_data/chemgridmap-${version}-validation.zip`);
            for (const path of paths) {
              const data = fs.readFileSync(path);
              await github.rest.repos.uploadReleaseAsset({owner, repo, release_id: result.data.id,
                name: path.split('/').pop(), data});
            }
